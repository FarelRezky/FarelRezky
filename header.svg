<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Hi, I'm Farel Rezky Aditya - Aspiring Web and Mobile Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0000"/>
      <stop offset="0.5" stop-color="#620000"/>
      <stop offset="1" stop-color="#1a0000"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="24s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#FFC400"/>
      <stop offset="0.5" stop-color="#FFF3B0"/>
      <stop offset="1" stop-color="#FFC400"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="round"><rect width="900" height="260" rx="18"/></clipPath>
    <clipPath id="typing">
      <rect x="235" y="138" height="44" width="0">
        <animate attributeName="width" values="0;430;430;0" keyTimes="0;0.5;0.88;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .title { font: 800 46px 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: url(#gold); animation: rise 1.3s ease-out both; }
    .sub   { font: 600 22px 'Courier New', Consolas, monospace; fill: #ffe9a0; }
    .line  { transform-box: fill-box; transform-origin: center; animation: grow 1.4s .7s ease-out both; }
    .cursor { animation: blink 0.9s steps(1) infinite; }
    @keyframes rise  { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="900" height="260" fill="url(#bg)"/>

    <!-- partikel emas yang melayang naik -->
    <g fill="#FFD700">
      <circle cx="70"  cy="230" r="3"   opacity="0"><animate attributeName="cy" values="235;30" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="170" cy="230" r="2"   opacity="0"><animate attributeName="cy" values="235;50" dur="9s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0" dur="9s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="290" cy="230" r="2.5" opacity="0"><animate attributeName="cy" values="235;20" dur="8s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="8s" begin="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="400" cy="230" r="2"   opacity="0"><animate attributeName="cy" values="235;40" dur="10s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;0" dur="10s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="230" r="3"   opacity="0"><animate attributeName="cy" values="235;25" dur="7.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="7.5s" begin="3s" repeatCount="indefinite"/></circle>
      <circle cx="630" cy="230" r="2"   opacity="0"><animate attributeName="cy" values="235;55" dur="9s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0" dur="9s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="230" r="2.5" opacity="0"><animate attributeName="cy" values="235;30" dur="8s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="8s" begin="4s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="230" r="3"   opacity="0"><animate attributeName="cy" values="235;45" dur="6.5s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="6.5s" begin="2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- gelombang belakang (emas tipis, bergerak ke kiri) -->
    <g>
      <path fill="#FFD700" opacity="0.14" d="M0,222 q112.5,-36 225,0 t225,0 t225,0 t225,0 t225,0 t225,0 t225,0 t225,0 V260 H0 Z"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="9s" repeatCount="indefinite"/>
    </g>
    <!-- gelombang tengah (merah, bergerak ke kanan) -->
    <g>
      <path fill="#8B0000" opacity="0.6" d="M0,232 q112.5,-32 225,0 t225,0 t225,0 t225,0 t225,0 t225,0 t225,0 t225,0 V260 H0 Z"/>
      <animateTransform attributeName="transform" type="translate" from="-450 0" to="0 0" dur="7s" repeatCount="indefinite"/>
    </g>
    <!-- gelombang depan (merah gelap, bergerak ke kiri) -->
    <g>
      <path fill="#2b0000" opacity="0.95" d="M0,243 q112.5,-26 225,0 t225,0 t225,0 t225,0 t225,0 t225,0 t225,0 t225,0 V260 H0 Z"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="5s" repeatCount="indefinite"/>
    </g>

    <!-- judul -->
    <text class="title" x="450" y="100" text-anchor="middle">Hi, I'm Farel Rezky Aditya</text>

    <!-- subjudul dengan efek mengetik -->
    <g clip-path="url(#typing)">
      <text class="sub" x="235" y="168" textLength="430" lengthAdjust="spacingAndGlyphs">Aspiring Web &amp; Mobile Developer</text>
    </g>
    <rect class="cursor" x="235" y="144" width="3" height="30" rx="1.5" fill="#FFD700">
      <animate attributeName="x" values="235;665;665;235" keyTimes="0;0.5;0.88;1" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- garis aksen -->
    <rect class="line" x="375" y="196" width="150" height="3" rx="1.5" fill="url(#gold)"/>
  </g>

  <rect x="1" y="1" width="898" height="258" rx="17" fill="none" stroke="#8B0000" stroke-width="2"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
