<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-label="Let's build something useful together" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0000"/>
      <stop offset="0.5" stop-color="#620000"/>
      <stop offset="1" stop-color="#1a0000"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="24s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="round"><rect width="900" height="120" rx="18"/></clipPath>
  </defs>

  <style>
    .msg { font: 700 20px 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #FFD700; animation: breathe 3.5s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="900" height="120" fill="url(#bg)"/>

    <g>
      <path fill="#FFD700" opacity="0.14" d="M0,70 q112.5,-30 225,0 t225,0 t225,0 t225,0 t225,0 t225,0 t225,0 t225,0 V120 H0 Z"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="9s" repeatCount="indefinite"/>
    </g>
    <g>
      <path fill="#8B0000" opacity="0.6" d="M0,82 q112.5,-28 225,0 t225,0 t225,0 t225,0 t225,0 t225,0 t225,0 t225,0 V120 H0 Z"/>
      <animateTransform attributeName="transform" type="translate" from="-450 0" to="0 0" dur="7s" repeatCount="indefinite"/>
    </g>
    <g>
      <path fill="#2b0000" opacity="0.95" d="M0,96 q112.5,-22 225,0 t225,0 t225,0 t225,0 t225,0 t225,0 t225,0 t225,0 V120 H0 Z"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="5s" repeatCount="indefinite"/>
    </g>

    <text class="msg" x="450" y="46" text-anchor="middle">Let's build something useful together.</text>
  </g>

  <rect x="1" y="1" width="898" height="118" rx="17" fill="none" stroke="#8B0000" stroke-width="2"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
